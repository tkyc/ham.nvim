name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly early-warning run. The suite doesn't hit Google (no logged-in cookies in
  # CI), so this won't catch AI Mode markup changes — but it does catch drift in the
  # moving parts underneath ham: a new Firefox/WebDriver BiDi release, a puppeteer-core
  # update, or a Node / Neovim-nightly change that breaks the automation.
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC daily
  workflow_dispatch: {}

# A newer push to the same branch / PR cancels the older in-flight run (but never a
# scheduled run, which uses a distinct ref).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (nvim ${{ matrix.neovim }}, node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Neovim floor is 0.10 (README); cover the current stable and nightly.
        neovim: [stable, nightly]
        # Node floor is 22 (README: needs node:sqlite for http mode). On 22 the
        # profile_cookies test self-skips (node:sqlite is flag-gated there); on 24 it
        # runs for real. Both keep the rest of the suite honest.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Set up Neovim ${{ matrix.neovim }}
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      # The browser-mode integration tests launch a throwaway headless Firefox; the
      # Lua command test spawns the real node backend (which requires puppeteer-core).
      # Without Firefox those tests self-skip, so installing it turns them into real
      # coverage instead of skips.
      - name: Set up Firefox
        uses: browser-actions/setup-firefox@v1

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Tool versions
        run: |
          node --version
          nvim --version | head -1
          firefox --version || true

      - name: Run test suite
        run: bash test/run.sh
